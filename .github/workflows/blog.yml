name: Latest blog posts

on:
  schedule:
    - cron: "0 3 * * *" # every day at 08:30 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://devsv.in/blog/rss.xml"
          max_post_count: 5
          commit_message: "Update latest blog posts"
